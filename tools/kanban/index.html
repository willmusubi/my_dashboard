<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>治理看板</title>
<style>
  :root {
    --paper: #f5f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef0f3;
    --ink: #14181f;
    --ink-dim: #5b6472;
    --ink-faint: #8890a0;
    --line: #dde1e7;
    --line-strong: #c3c9d3;
    --accent: #3446d6;
    --accent-soft: #eaeefc;
    --good: #1f9d6b;
    --good-soft: #e4f5ee;
    --warn: #c9860a;
    --warn-soft: #fbf1de;
    --crit: #d23b3b;
    --crit-soft: #fbe8e8;
    --muted: #6b7280;
    --muted-soft: #eceef1;
    /* 人 vs AI 的身份色 —— 这是本产品的核心语义，不是装饰 */
    --actor-human: #b45309;
    --actor-agent: #3446d6;
    --shadow-card: 0 1px 2px rgba(20, 24, 31, 0.06), 0 1px 1px rgba(20, 24, 31, 0.04);
    --shadow-card-hover: 0 6px 20px rgba(20, 24, 31, 0.12);
    --shadow-modal: 0 24px 64px rgba(20, 24, 31, 0.28);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { text-wrap: balance; font-weight: 650; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(52, 70, 214, 0.35);
    border-radius: 6px;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  /* ── Top chrome ── */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar-row1 { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 28px 4px; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12.5px; color: var(--ink-dim); }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-sunken); border-radius: 10px; padding: 3px; }
  .view-tabs button { border: none; background: transparent; color: var(--ink-dim); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; transition: background-color .15s ease, color .15s ease; }
  .view-tabs button:hover { color: var(--ink); }
  .view-tabs button.is-active { background: var(--ink); color: #fff; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ── pills ── */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .risk-low { background: var(--muted-soft); color: var(--muted); }
  .risk-medium { background: var(--warn-soft); color: var(--warn); }
  .risk-high { background: var(--crit-soft); color: var(--crit); }
  .agent-pill { background: var(--accent-soft); color: var(--accent); }
  .track-pill { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .dep-pill.dep-blocked { background: var(--crit-soft); color: var(--crit); }
  .dep-pill.dep-missing { background: var(--warn-soft); color: var(--warn); }
  .dep-pill.dep-ok { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .approval-pill { background: var(--surface); color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .risk-stripe-low::before { background: var(--muted); }
  .risk-stripe-medium::before { background: var(--warn); }
  .risk-stripe-high::before { background: var(--crit); }

  /* ── card ── */
  .ticket-card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 10px 14px; box-shadow: var(--shadow-card); cursor: grab;
    transition: box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .ticket-card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
  .ticket-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .ticket-card.is-dragging { opacity: 0.4; }
  .ticket-id { font-size: 10.5px; color: var(--ink-faint); font-weight: 600; letter-spacing: 0.02em; }
  .ticket-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin: 3px 0 8px; }
  .ticket-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .ticket-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { .ticket-card, .modal, .modal-overlay { transition: none !important; } }

  /* ── lanes ── */
  .lanes { display: flex; gap: 1px; background: var(--line); overflow-x: auto; scroll-snap-type: x proximity; border-top: 1px solid var(--line); }
  .lane { flex: 0 0 232px; scroll-snap-align: start; background: var(--paper); min-height: calc(100vh - 156px); display: flex; flex-direction: column; }
  .lane.is-drag-over { background: var(--accent-soft); }
  .lane-head { position: sticky; top: 0; padding: 12px 12px 10px; border-bottom: 2px solid var(--line-strong); background: var(--paper); z-index: 1; }
  .lane-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .lane-title { font-size: 13px; font-weight: 700; }
  .lane-gauge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-dim); flex-shrink: 0; }
  .lane-gauge.is-over { background: var(--crit); color: #fff; }
  .lane-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .lane-empty { font-size: 11.5px; color: var(--ink-faint); padding: 10px 2px; }
  .lane-add-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-faint); border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 600; text-align: center; }
  .lane-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .lane-add-form { display: flex; flex-direction: column; gap: 6px; }
  .lane-add-form input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; }
  .lane-add-form .row { display: flex; gap: 6px; }
  .lane-add-form button { border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .lane-add-form .save { background: var(--ink); color: #fff; flex: 1; }
  .lane-add-form .cancel { background: var(--surface-sunken); color: var(--ink-dim); }

  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 24, 31, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; z-index: 100; opacity: 0; transition: opacity .15s ease; }
  .modal-overlay.is-open { opacity: 1; }
  .modal-overlay[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 720px; box-shadow: var(--shadow-modal); transform: translateY(8px) scale(0.98); transition: transform .15s ease; }
  .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; gap: 12px; }
  .modal-id { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; }
  .modal-title-input { font-size: 18px; font-weight: 700; margin: 4px 0 0; width: 100%; border: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px; }
  .modal-title-input:hover, .modal-title-input:focus { background: var(--surface-sunken); }
  .modal-close { border: none; background: var(--surface-sunken); color: var(--ink-dim); width: 30px; height: 30px; border-radius: 8px; font-size: 15px; flex-shrink: 0; }
  .modal-close:hover { color: var(--ink); }
  .rev-tag { font-weight: 400; color: var(--ink-faint); margin-left: 8px; }
  .fld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 16px; }
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fld-wide { grid-column: 1 / -1; }
  .fld-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .fld-input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; background: var(--surface); color: var(--ink); font-family: inherit; }
  .fld-input:focus { outline: 2px solid var(--accent-soft); outline-offset: 0; border-color: var(--accent); }
  .fld-area { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-height: 62px; resize: vertical; font-family: var(--font-mono); background: var(--surface); color: var(--ink); }
  .fld-inline { display: flex; align-items: center; min-height: 31px; }
  .chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; }
  .chk input { width: 15px; height: 15px; accent-color: var(--accent); flex-shrink: 0; }
  .chk input:checked + span { color: var(--ink); font-weight: 600; }
  /* 「只有你能勾」的项：一眼看出该动哪个 */
  .chk-human span { color: var(--actor-human); }
  .chk-human input { accent-color: var(--actor-human); }
  .chk-who { font-size: 11px; line-height: 1; flex-shrink: 0; }
  .chk-note { font-size: 10.5px; color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
  /* 这张卡不需要的关卡：弱化，别让它看起来像待办 */
  .chk-na { opacity: 0.42; }
  .chk-na input { pointer-events: auto; }
  .sect-hint { font-size: 10.5px; color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  /* ⓘ 展开「这一关查什么」—— 检查项逐字来自 review-gates.md */
  .chk-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .chk-row .chk { min-width: 0; }
  .gate-i { border: none; background: transparent; color: var(--ink-faint); font-size: 12px; padding: 0 2px; line-height: 1; flex-shrink: 0; }
  .gate-i:hover { color: var(--accent); }
  .gate-info { margin-top: 10px; background: var(--surface-sunken); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; }
  .gate-info-head { font-weight: 700; margin-bottom: 6px; }
  .gate-info ul { margin: 0 0 8px; padding-left: 18px; color: var(--ink-dim); }
  .gate-info li { margin-bottom: 2px; }
  .gate-info-who { color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; }
  .gate-info-src { font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; }
  .tally { font-size: 11px; font-weight: 700; color: var(--ink-faint); background: var(--surface-sunken); border-radius: 999px; padding: 1px 7px; margin-left: 6px; letter-spacing: 0; text-transform: none; }
  .tally-full { color: var(--good); background: var(--good-soft); }
  .sect { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
  .sect > summary { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); cursor: pointer; }
  .sect > summary:hover { color: var(--ink-dim); }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .modal-body { padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 8px; display: block; }
  .content-input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; resize: vertical; min-height: 220px; }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .comment-name { font-size: 12.5px; font-weight: 700; }
  .comment-time { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
  .comment-text { font-size: 13px; color: var(--ink-dim); margin-top: 2px; line-height: 1.5; white-space: pre-wrap; }
  .no-comment { font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .pending-pill { background: var(--warn-soft); color: var(--warn); }

  /* ── 留言：人和 AI 的身份要一眼分得出 ── */
  .cm-body { min-width: 0; flex: 1; }
  .comment.is-superseded { opacity: 0.5; }
  .comment.is-superseded .comment-text { text-decoration: line-through; }
  .av-human { background: var(--actor-human, #b45309); }
  .av-agent { background: var(--actor-agent, var(--accent)); }
  .cm-kind { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 6px; background: var(--surface-sunken); color: var(--ink-dim); }
  .cm-kind-decision { background: var(--accent-soft); color: var(--accent); }
  .cm-kind-question { background: var(--warn-soft); color: var(--warn); }
  .cm-kind-blocker { background: var(--crit-soft); color: var(--crit); }
  .cm-status { font-size: 10.5px; font-weight: 700; margin-left: 5px; color: var(--ink-faint); }
  .cm-open { color: var(--warn); }
  .cm-acked { color: var(--accent); }
  .cm-done { color: var(--good); }
  .cm-supersede { border: 1px solid var(--line-strong); background: transparent; color: var(--ink-dim); border-radius: 6px; padding: 2px 8px; font-size: 11px; margin-top: 6px; }
  .cm-supersede:hover { color: var(--crit); border-color: var(--crit); }

  .kind-pick { display: flex; gap: 4px; align-items: center; margin-bottom: 8px; background: var(--surface-sunken); border-radius: 8px; padding: 3px; width: fit-content; }
  .kind-pick button[data-kind] { border: none; background: transparent; color: var(--ink-dim); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px; }
  .kind-pick button[data-kind].is-picked { background: var(--ink); color: #fff; }
  .superseding { font-size: 11px; color: var(--crit); font-weight: 700; margin-left: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .superseding button { border: none; background: transparent; color: var(--crit); font-size: 14px; padding: 0 2px; }

  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-height: 40px; resize: vertical; }
  .comment-form button { border: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; align-self: flex-start; }
  .modal-footer { display: flex; justify-content: space-between; padding: 0 24px 22px; }
  .danger-btn { border: 1px solid var(--crit-soft); background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .danger-btn:hover { background: var(--crit); color: #fff; }

  /* ── roadmap ── */
  .roadmap { padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1100px; }
  .progress-bar { height: 6px; border-radius: 4px; background: var(--surface-sunken); overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .epic-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-card); }
  .epic-head { padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 8px; }
  .epic-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .epic-name { font-size: 15.5px; font-weight: 700; }
  .epic-frac { font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .epic-def { font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; max-width: 80ch; }
  .epic-body { padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
  .story-block { border-top: 1px solid var(--line); padding-top: 14px; }
  .story-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .story-name { font-size: 13px; font-weight: 700; }
  .story-frac { font-size: 11.5px; color: var(--ink-dim); font-weight: 700; flex-shrink: 0; }
  .story-def { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; line-height: 1.5; }
  .story-progress { margin-bottom: 10px; }
  .story-tasks { display: flex; flex-direction: column; gap: 1px; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
  .task-row:hover { background: var(--surface-sunken); }
  .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-id { font-size: 10.5px; color: var(--ink-faint); flex-shrink: 0; width: 62px; }
  .task-title { flex: 1; }
  .task-title.is-done { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .no-tasks { font-size: 12px; color: var(--ink-faint); padding: 4px 8px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 200; }
  #toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.is-error { background: var(--crit); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div class="brand">
      <span class="brand-name">治理看板</span>
      <span class="brand-sub">人 ↔ AI 的决策通道</span>
    </div>
    <div class="view-tabs" role="tablist">
      <button type="button" class="is-active" data-view="board" role="tab">看板</button>
      <button type="button" data-view="roadmap" role="tab">蓝图</button>
    </div>
  </div>
</div>

<main>
  <section id="view-board" class="view is-active">
    <div class="lanes" id="lanes"></div>
  </section>
  <section id="view-roadmap" class="view">
    <div class="roadmap" id="roadmap"></div>
  </section>
</main>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var COMMENT_AUTHOR = ""; // 开页时由 /api/config 带入本机 git user.name
  var ID_PREFIX = "DASH";  // 同上，由 /api/config 带入，供 dependsOn 的提示文字用

  var STAGES = [
    { id: "backlog",       label: "Backlog 待办",      color: "#5b6472" },
    { id: "blocked",       label: "Blocked",           color: "#d23b3b" },
    { id: "ready",         label: "Ready 就绪",        color: "#147d6f" },
    { id: "implementing",  label: "Implementing 进行中", color: "#3446d6" },
    { id: "verify",        label: "Verify 验证中",      color: "#6b46c1" },
    { id: "done",          label: "Done 完成",         color: "#1f9d6b" }
  ];
  var WIP_CAPS = { implementing: 3, verify: 5 };

  var TICKETS = [];
  var EPICS = [];
  var openId = null;
  var openGate = null;   // 当前展开说明的那一关，一次只展开一个
  var currentView = "board";

  function stageIndex(id) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return i; return -1; }
  function getTicket(id) { return TICKETS.filter(function (x) { return x.id === id; })[0]; }
  function ticketsByStage(id) {
    return TICKETS.filter(function (x) { return x.stage === id; }).sort(function (a, b) { return a.order - b.order; });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function riskLabel(r) { return { low: "低风险", medium: "中风险", high: "高风险" }[r] || r; }
  function trackLabel(t) {
    return { frontend: "前端", backend: "后端", integration: "前后端串接", fullstack: "全栈", "n/a": "" }[t] || "";
  }

  var RISKS = ["low", "medium", "high"];
  var TRACKS = ["frontend", "backend", "integration", "fullstack", "n/a"];
  var READINESS = [
    ["problem_clear", "问题明确"], ["non_goals_clear", "非目标明确"],
    ["acceptance_testable", "验收可测"], ["files_known", "相关文件已列出"],
    ["scope_defined", "范围有界"], ["verification_contract", "验证方法已定"],
    ["human_approval_recorded", "人工批准已记录"]
  ];
  /* [key, 标签, 这一关查什么]
     检查项**逐字取自 ai/process/review-gates.md** —— 界面只是把它呈现出来，不发明规则。
     「安全」两个字加一个空框，人无从判断；把这一关到底在查什么摊开，才谈得上判断。 */
  var GATES = [
    ["product", "产品", [
      "这个问题值得解决吗？",
      "非目标是否清楚？",
      "用户流程与验收标准是否完整？",
      "边界案例是否涵盖？"
    ]],
    ["ui", "UI", [
      "是否有多个变体？",
      "是否涵盖默认、空状态、载入中、错误与移动版状态？",
      "变体是否以 design-system.md 既有的 token 与组件组成？",
      "新做的组件是否依既有风格制作、并已登记回组件库 inventory？",
      "选定的变体是否符合产品意图？",
      "视觉验收标准是否清楚？"
    ]],
    ["architecture", "架构", [
      "计划是否遵循既有模式？",
      "是否避免不必要的抽象？",
      "数据契约是否清楚？",
      "迁移与回滚风险是否已被理解？"
    ]],
    ["security", "安全", [
      "输入验证",
      "身份验证与授权",
      "密钥处理",
      "注入风险",
      "文件与网络边界",
      "敏感数据的记录行为",
      "依赖包与供应链风险"
    ]],
    ["test", "测试", [
      "是否有针对预期行为的测试？",
      "回归风险是否已涵盖？",
      "CI 相关指令是否通过？",
      "UI 屏幕截图是否已审查（如适用）？"
    ]],
    ["code_review", "Code Review", [
      "Diff 够小",
      "摘要清楚",
      "已附上证据",
      "审查发现已解决或已记录",
      "已记录人工验收"
    ]]
  ];

  /* ── 谁负责勾什么 ──
     这段规则与 card-store.mjs 的 requiredGates / gateOwner 是同一套。
     **改一处必须改另一处** —— index.html 是内联脚本，没有 module 机制可共用。
     服务端那份有单元测试覆盖（test-store.mjs）。

     readiness 与 gates 的语义是相反的，不要用同一套显示逻辑：
       readiness → 7 项必须全满才能进 ready
       gates     → 按需。低风险的卡不需要架构和安全审查，分母不是固定的 6 */
  var HUMAN_GATES = ["product", "ui"];              // 只有人能批
  var HUMAN_GATES_HIGH = ["architecture", "security"]; // 高风险时也需要人
  var HUMAN_READINESS = ["human_approval_recorded"];

  function requiredGates(tk) {
    var req = ["product", "test", "code_review"];
    if (tk.track === "frontend" || tk.track === "fullstack") req.push("ui");
    if (tk.risk === "high") req.push("architecture", "security");
    return GATES.map(function (p) { return p[0]; })
      .filter(function (k) { return req.indexOf(k) >= 0; });
  }

  /* 三种，不是两种。中间那种最容易被压扁，也正是「我无法判断」的来源：
       human            —— 你自己判断（产品意图、验收标准，本来就是你的领域）
       agent_then_human —— **agent 先审出结论，你读结论后拍板**（高风险的架构／安全）
       agent            —— agent 负责，你不用管 */
  function gateOwner(tk, key) {
    if (HUMAN_GATES.indexOf(key) >= 0) return "human";
    if (tk.risk === "high" && HUMAN_GATES_HIGH.indexOf(key) >= 0) return "agent_then_human";
    return "agent";
  }
  function needsYou(owner) {
    return owner === "human" || owner === "agent_then_human";
  }
  var LINKS = [
    ["featureSpec", "功能规格书"], ["taskCard", "任务卡"], ["screenSpec", "画面规格"],
    ["mockupDecision", "Mockup 决策"], ["verificationReport", "验证报告"], ["pr", "PR"]
  ];

  /* 支持 "readiness.problem_clear" 这种嵌套路径，让所有字段共用一套读写逻辑，
     不用为每个字段各写一个 if 分支。 */
  function getPath(o, p) {
    return p.split(".").reduce(function (x, k) { return x == null ? undefined : x[k]; }, o);
  }
  function setPath(o, p, v) {
    var ks = p.split("."), last = ks.pop();
    var t = ks.reduce(function (x, k) { return x[k]; }, o);
    t[last] = v;
  }

  /* ── API ── */
  function api(path, options) {
    return fetch(path, options).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (e) {
          var err = new Error(e.error || res.statusText);
          err.status = res.status;   // 409 要能被区分出来做重载，不能靠比对错误文案
          throw err;
        });
      }
      return res.json();
    });
  }
  /** 服务端说这张卡在我们读到之后被改过（多半是 agent 写的）。硬覆盖会静默
   *  丢掉那次改动，所以一律重新载入，让人看到最新状态后自己重做。 */
  function onConflict(err) {
    if (err && err.status === 409) {
      showToast(err.message, true);
      loadAll().then(function () { renderAll(); if (openId) openModal(openId); });
      return true;
    }
    return false;
  }
  function loadAll() {
    return Promise.all([
      api("/api/cards").then(function (list) { TICKETS = list; }),
      api("/api/epics").then(function (data) { EPICS = data.epics || []; }),
      api("/api/config").then(function (cfg) {
        COMMENT_AUTHOR = cfg.owner || "匿名";
        if (cfg.idPrefix) ID_PREFIX = cfg.idPrefix;
      }),
      // 解析失败的卡片档不会出现在 /api/cards 里（塞进去会被拖拽静默覆盖），
      // 所以必须主动问一次，否则它们就是无声消失。
      api("/api/issues").then(function (d) {
        if (d.broken && d.broken.length) {
          showToast("有 " + d.broken.length + " 个卡片档解析失败：" +
            d.broken.map(function (b) { return b.file; }).join("、"), true);
        }
      }).catch(function () {})
    ]);
  }
  function saveOne(tk) {
    return api("/api/cards/" + encodeURIComponent(tk.id), {
      method: "PUT",
      headers: { "Content-Type": "application/json", "If-Match": String(tk.rev) },
      body: JSON.stringify(tk)
    }).catch(function (err) {
      if (!onConflict(err)) showToast("保存失败：" + err.message, true);
      throw err;
    });
  }
  function saveBulk(list) {
    return api("/api/cards", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(list)
    }).catch(function (err) {
      if (!onConflict(err)) showToast("保存失败：" + err.message, true);
      throw err;
    });
  }
  function createCard(input) {
    return api("/api/cards", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(input)
    }).catch(function (err) { showToast("新增失败：" + err.message, true); throw err; });
  }
  function deleteCard(id) {
    return api("/api/cards/" + encodeURIComponent(id), { method: "DELETE" })
      .catch(function (err) { showToast("删除失败：" + err.message, true); throw err; });
  }
  /** 留言走专用的 append-only 端点。整卡 PUT 已不接受 comments —— 那是为了让
   *  「人在浏览器拖卡」永远不可能洗掉 agent 刚贴的留言。 */
  function addComment(id, kind, text, supersedes) {
    return api("/api/cards/" + encodeURIComponent(id) + "/comments", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: kind, text: text, supersedes: supersedes || [] })
    }).catch(function (err) { showToast("留言失败：" + err.message, true); throw err; });
  }

  /* ── render: lanes ── */
  function dependsOnBadge(tk) {
    if (!tk.dependsOn || !tk.dependsOn.length) return "";
    var missing = [], unmet = [];
    tk.dependsOn.forEach(function (id) {
      var dep = getTicket(id);
      if (!dep) missing.push(id); else if (dep.stage !== "done") unmet.push(id);
    });
    if (missing.length) return '<span class="pill dep-pill dep-missing">⚠️ 依赖的卡片已不存在</span>';
    if (unmet.length) return '<span class="pill dep-pill dep-blocked">⛔ 依赖 ' + unmet.length + ' 张未完成</span>';
    return '<span class="pill dep-pill dep-ok">🔗 依赖 ' + tk.dependsOn.length + ' 张（已完成）</span>';
  }

  function cardHtml(tk) {
    var badges = '<span class="pill risk-' + tk.risk + '">' + riskLabel(tk.risk) + "</span>";
    if (tk.track && tk.track !== "n/a") badges += '<span class="pill track-pill">' + trackLabel(tk.track) + "</span>";
    if (tk.agent) badges += '<span class="pill agent-pill">' + escapeHtml(tk.agent) + "</span>";
    if (tk.approvalRequired) badges += '<span class="pill approval-pill">需人工批准</span>';
    badges += dependsOnBadge(tk);
    // 有人写的、agent 还没确认的项 —— 从看板一眼就能看出哪张卡在等 agent 回应
    var pend = pendingHumanCount(tk);
    if (pend) badges += '<span class="pill pending-pill">💬 ' + pend + " 待处理</span>";
    return (
      '<div class="ticket-card risk-stripe-' + tk.risk + '" data-id="' + escapeHtml(tk.id) + '" draggable="true" tabindex="0">' +
      '<div class="ticket-id mono">' + tk.id + "</div>" +
      '<div class="ticket-title">' + escapeHtml(tk.title) + "</div>" +
      '<div class="ticket-badges">' + badges + "</div>" +
      '<div class="ticket-meta-row"><span>' + escapeHtml(tk.owner) + "</span></div>" +
      "</div>"
    );
  }

  function laneHtml(stage) {
    var items = ticketsByStage(stage.id);
    var cap = WIP_CAPS[stage.id];
    var over = cap && items.length > cap;
    var gauge = cap ? items.length + " / " + cap : String(items.length);
    var body = items.length ? items.map(cardHtml).join("") : '<div class="lane-empty">— 没有卡片 —</div>';
    return (
      '<div class="lane" data-stage="' + stage.id + '" style="border-top: 3px solid ' + stage.color + '">' +
      '<div class="lane-head">' +
      '<div class="lane-title-row"><span class="lane-title">' + stage.label + "</span>" +
      '<span class="lane-gauge tabular' + (over ? " is-over" : "") + '">' + gauge + "</span>" +
      "</div></div>" +
      '<div class="lane-body" data-lane-body="' + stage.id + '">' + body +
      '<button type="button" class="lane-add-btn" data-add-to="' + stage.id + '">+ 新增卡片</button>' +
      "</div></div>"
    );
  }

  function renderLanes() {
    document.getElementById("lanes").innerHTML = STAGES.map(laneHtml).join("");
  }

  /* ── render: roadmap ── */
  function pct(done, total) { return total ? Math.round((done / total) * 100) : 0; }

  function taskRowHtml(tk) {
    var stage = STAGES[stageIndex(tk.stage)];
    var done = tk.stage === "done";
    return (
      '<button type="button" class="task-row" data-open="' + escapeHtml(tk.id) + '">' +
      '<span class="task-dot" style="background:' + stage.color + '"></span>' +
      '<span class="task-id mono">' + tk.id + "</span>" +
      '<span class="task-title' + (done ? " is-done" : "") + '">' + escapeHtml(tk.title) + "</span>" +
      (tk.track && tk.track !== "n/a" ? '<span class="pill track-pill">' + trackLabel(tk.track) + "</span>" : "") +
      '<span class="pill risk-' + tk.risk + '">' + riskLabel(tk.risk) + "</span>" +
      "</button>"
    );
  }

  function storyBlockHtml(epicName, story) {
    var epicDef = EPICS.filter(function (e) { return e.name === epicName; })[0];
    var knownStoryNames = epicDef ? epicDef.stories.map(function (s) { return s.name; }) : [];
    var tasks = TICKETS.filter(function (t) {
      if (t.epic !== epicName) return false;
      return story.__orphan ? knownStoryNames.indexOf(t.userStory) === -1 : t.userStory === story.name;
    });
    var doneCount = tasks.filter(function (t) { return t.stage === "done"; }).length;
    var body = tasks.length
      ? '<div class="story-tasks">' + tasks.map(taskRowHtml).join("") + "</div>"
      : '<p class="no-tasks">尚无任务卡。</p>';
    return (
      '<div class="story-block">' +
      '<div class="story-head"><span class="story-name">' + escapeHtml(story.name) + "</span>" +
      '<span class="story-frac tabular">' + doneCount + " / " + tasks.length + " 完成 · " + pct(doneCount, tasks.length) + "%</span></div>" +
      '<p class="story-def">' + escapeHtml(story.definition || "") + "</p>" +
      '<div class="progress-bar story-progress"><span style="width:' + pct(doneCount, tasks.length) + '%"></span></div>' +
      body +
      "</div>"
    );
  }

  function epicCardHtml(epic) {
    var tasks = TICKETS.filter(function (t) { return t.epic === epic.name; });
    var doneCount = tasks.filter(function (t) { return t.stage === "done"; }).length;
    var storyNames = (epic.stories || []).map(function (s) { return s.name; });
    var stories = (epic.stories || []).map(function (s) { return storyBlockHtml(epic.name, s); }).join("");
    var orphans = tasks.filter(function (t) { return storyNames.indexOf(t.userStory) === -1; });
    if (orphans.length) {
      stories += storyBlockHtml(epic.name, { name: "（未分类任务）", definition: "属于这个 Epic，但还没指定 User Story。", __orphan: true });
    }
    return (
      '<div class="epic-card">' +
      '<div class="epic-head">' +
      '<div class="epic-title-row"><span class="epic-name">' + escapeHtml(epic.name) + "</span>" +
      '<span class="epic-frac tabular">' + doneCount + " / " + tasks.length + " 完成 · " + pct(doneCount, tasks.length) + "%</span></div>" +
      '<p class="epic-def">' + escapeHtml(epic.definition || "") + "</p>" +
      '<div class="progress-bar"><span style="width:' + pct(doneCount, tasks.length) + '%"></span></div>' +
      "</div>" +
      '<div class="epic-body">' + stories + "</div>" +
      "</div>"
    );
  }

  function renderRoadmap() {
    document.getElementById("roadmap").innerHTML = EPICS.length
      ? EPICS.map(epicCardHtml).join("")
      : '<p class="no-tasks">尚无 Epic。开始新项目时，先跟 Claude 说明这个项目要做什么，' +
        '走一遍 spec-interrogation → implementation-plan 流程，把功能模块（Epic）、用户需求（User Story）' +
        '写进 <span class="mono">tools/kanban/epics.json</span>，任务卡再通过看板分页的「+ 新增卡片」建立并指定 Epic / User Story。</p>';
  }

  function renderAll() { renderLanes(); renderRoadmap(); }

  function switchView(v) {
    currentView = v;
    document.querySelectorAll(".view").forEach(function (el) { el.classList.remove("is-active"); });
    document.getElementById("view-" + v).classList.add("is-active");
    document.querySelectorAll(".view-tabs button").forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.view === v);
    });
  }

  /* ── modal ── */
  function stageLabel(id) { var s = STAGES[stageIndex(id)]; return s ? s.label : id; }

  /* 所有可编辑控件都靠 data-field（值的路径）+ data-kind（怎么解析）驱动，
     统一交给一个 handler 处理。上游是给每个字段各写一个 if 分支，只撑得住
     两个字段——而真实数据显示 links/readiness/refs/gates/evidence 全都在用，
     只是一直靠手改 JSON。 */
  function fInput(label, path, value, o) {
    o = o || {};
    return '<label class="fld' + (o.wide ? " fld-wide" : "") + '"><span class="fld-label">' + label + "</span>" +
      '<input class="fld-input" data-field="' + path + '" data-kind="' + (o.kind || "text") + '"' +
      (o.list ? ' list="' + o.list + '"' : "") +
      ' placeholder="' + escapeHtml(o.placeholder || "") + '"' +
      ' value="' + escapeHtml(value == null ? "" : value) + '"></label>';
  }
  function fSelect(label, path, value, options, labelFn) {
    var body = options.map(function (v) {
      return '<option value="' + escapeHtml(v) + '"' + (v === value ? " selected" : "") + ">" +
        escapeHtml(labelFn ? (labelFn(v) || v) : v) + "</option>";
    }).join("");
    return '<label class="fld"><span class="fld-label">' + label + "</span>" +
      '<select class="fld-input" data-field="' + path + '" data-kind="text">' + body + "</select></label>";
  }
  function fCheck(label, path, value, o) {
    o = o || {};
    var yours = needsYou(o.owner);
    var cls = "chk" + (o.dim ? " chk-na" : "") + (yours ? " chk-human" : "");
    // 👤 标出「需要你拍板」的项 —— 20 个字段长得一样时，人不知道该动哪个。
    // 注意它不等于「你自己去做审查」：agent_then_human 的项要 agent 先出结论。
    var mark = yours ? '<span class="chk-who" title="需要你拍板">👤</span>' : "";
    var box = '<label class="' + cls + '"><input type="checkbox" data-field="' + path +
      '" data-kind="bool"' + (value ? " checked" : "") + ">" + mark + "<span>" + label +
      (o.note ? '<span class="chk-note">' + o.note + "</span>" : "") + "</span></label>";
    if (!o.info) return box;
    // ⓘ 放在 label 外，否则点它会顺带切换复选框
    return '<div class="chk-row">' + box +
      '<button type="button" class="gate-i" data-gate-info="' + o.info +
      '" title="这一关查什么">ⓘ</button></div>';
  }

  /** 展开某一关的说明：查什么、谁出结论、谁拍板、还没结论时你该说什么。 */
  function gateInfoHtml(tk, key) {
    var g = GATES.filter(function (p) { return p[0] === key; })[0];
    if (!g) return "";
    var owner = gateOwner(tk, key);
    var isReq = requiredGates(tk).indexOf(key) >= 0;
    var who = {
      human:
        "<b>你判断。</b>这是产品意图与验收标准的问题，agent 不该代你下结论。",
      agent_then_human:
        "<b>agent 先审出结论，你再拍板。</b>让它跑 <span class=\"mono\">security-maintainability-review</span>，" +
        "产出「发现的问题／影响／建议修法／批准建议」，你读完决定采纳还是打回。" +
        "<b>没有结论之前不用勾</b>——可以直接说「让 claude 审一下这张卡的" + g[1] + "」。",
      agent:
        "<b>agent 负责。</b>它审完自己勾，你不用管。"
    }[owner];
    return '<div class="gate-info">' +
      '<div class="gate-info-head">「' + g[1] + '」这一关查什么' +
      (isReq ? "" : '<span class="chk-note"> · 这张卡不需要这一关</span>') + "</div>" +
      "<ul>" + g[2].map(function (c) { return "<li>" + escapeHtml(c) + "</li>"; }).join("") + "</ul>" +
      '<div class="gate-info-who">' + who + "</div>" +
      '<div class="gate-info-src">出处：ai/process/review-gates.md（界面只是把它呈现出来）</div>' +
      "</div>";
  }
  function fArea(label, path, value, kind, placeholder) {
    return '<div class="fld fld-wide"><span class="fld-label">' + label + "</span>" +
      '<textarea class="fld-area" data-field="' + path + '" data-kind="' + kind + '" placeholder="' +
      escapeHtml(placeholder || "") + '">' + escapeHtml(value || "") + "</textarea></div>";
  }
  /* ── 留言渲染 ── */
  var KIND_LABEL = {
    decision: "决策", question: "提问", answer: "回答", note: "留言",
    blocker: "阻塞", progress: "进度", evidence: "证据"
  };
  var STATUS_LABEL = { open: "待处理", acked: "已确认", done: "已完成", superseded: "已取代" };
  var supersedingId = null;   // 正在取代哪条决策

  function fmtAt(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var p = function (n) { return String(n).padStart(2, "0"); };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function commentHtml(c) {
    var isAgent = c.authorKind === "agent";
    var initial = c.author ? c.author.charAt(0).toUpperCase() : "?";
    var statusTxt = STATUS_LABEL[c.status] || c.status;
    // 「已确认 · 14:02」——把「AI 到底看没看见我的决定」从信仰变成可见状态
    if (c.status === "acked" || c.status === "done") statusTxt += " · " + fmtAt(c.statusAt);
    var canSupersede = c.kind === "decision" && (c.status === "open" || c.status === "acked");
    return '<div class="comment' + (c.status === "superseded" ? " is-superseded" : "") + '">' +
      '<div class="comment-avatar ' + (isAgent ? "av-agent" : "av-human") + '">' + escapeHtml(initial) + "</div>" +
      '<div class="cm-body">' +
      '<span class="comment-name">' + escapeHtml(c.author || "匿名") + "</span>" +
      '<span class="cm-kind cm-kind-' + c.kind + '">' + (KIND_LABEL[c.kind] || c.kind) + "</span>" +
      '<span class="cm-status cm-' + c.status + '">' + escapeHtml(statusTxt) + "</span>" +
      '<span class="comment-time">' + fmtAt(c.at) + "</span>" +
      '<div class="comment-text">' + escapeHtml(c.text) + "</div>" +
      (canSupersede ? '<button type="button" class="cm-supersede" data-supersede="' + c.id + '">取代这条决策</button>' : "") +
      "</div></div>";
  }

  /** 有人写的、还没处理完的项 —— 与服务端 liveHumanItems 同一套判据 */
  function pendingHumanCount(tk) {
    return (tk.comments || []).filter(function (c) {
      return c.authorKind === "human" && c.status === "open";
    }).length;
  }

  /** readiness 用：7 项必须全满才算就绪 */
  function tallyAll(pairs, obj) {
    var n = pairs.filter(function (p) { return obj[p[0]]; }).length;
    return '<span class="tally' + (n === pairs.length ? " tally-full" : "") + '">' +
      n + " / " + pairs.length + "</span>";
  }

  /** gates 用：分母是这张卡的必需项数，不是固定的 6。
   *  曾经这两处共用一个 tally()，于是 medium/frontend 卡显示成误导的 3/6。 */
  function tallyRequired(tk) {
    var req = requiredGates(tk);
    var n = req.filter(function (k) { return tk.gates[k]; }).length;
    return '<span class="tally' + (n === req.length ? " tally-full" : "") + '">' +
      n + " / " + req.length + "</span>";
  }

  function openModal(id) {
    openId = id;
    var tk = getTicket(id);
    if (!tk) return;

    var epicOpts = EPICS.map(function (e) { return '<option value="' + escapeHtml(e.name) + '">'; }).join("");
    var storyOpts = [];
    EPICS.forEach(function (e) {
      (e.stories || []).forEach(function (s) { storyOpts.push('<option value="' + escapeHtml(s.name) + '">'); });
    });

    var commentsHtml = tk.comments.length
      ? tk.comments.map(commentHtml).join("")
      : '<p class="no-comment">尚无留言。</p>';

    document.getElementById("modal").innerHTML =
      '<div class="modal-head"><div style="flex:1;"><div class="modal-id mono">' + tk.id +
      '<span class="rev-tag">rev ' + tk.rev + "</span></div>" +
      '<input class="modal-title-input" data-field="title" data-kind="text-required" value="' + escapeHtml(tk.title) + '"></div>' +
      '<button type="button" class="modal-close" id="modal-close-btn">✕</button></div>' +

      '<datalist id="dl-epics">' + epicOpts + "</datalist>" +
      '<datalist id="dl-stories">' + storyOpts.join("") + "</datalist>" +

      '<div class="modal-body">' +
      '<div class="fld-grid">' +
        fSelect("阶段", "stage", tk.stage, STAGES.map(function (s) { return s.id; }), stageLabel) +
        fSelect("风险", "risk", tk.risk, RISKS, riskLabel) +
        fSelect("分轨", "track", tk.track, TRACKS, function (t) { return trackLabel(t) || "不适用"; }) +
        fInput("Owner", "owner", tk.owner) +
        fInput("Agent", "agent", tk.agent, { placeholder: "claude-code" }) +
        '<div class="fld"><span class="fld-label">需人工批准</span><div class="fld-inline">' +
          fCheck("是", "approvalRequired", tk.approvalRequired) + "</div></div>" +
        fInput("Epic", "epic", tk.epic, { list: "dl-epics" }) +
        fInput("User Story", "userStory", tk.userStory, { list: "dl-stories" }) +
        fInput("前置任务 dependsOn", "dependsOn", (tk.dependsOn || []).join(", "),
          { wide: true, kind: "csv", placeholder: "留空表示无。例：" + ID_PREFIX + "-001, " + ID_PREFIX + "-002" }) +
      "</div>" +

      '<div><span class="modal-section-label">描述</span>' +
      '<textarea class="content-input" data-field="content" data-kind="text" placeholder="目标 / 非目标 / 验收标准 / 允许改的文件 / 验证命令…">' +
      escapeHtml(tk.content) + "</textarea></div>" +

      '<div><span class="modal-section-label">就绪 Readiness ' + tallyAll(READINESS, tk.readiness) +
      '<span class="sect-hint">7 项要全满才能进 ready</span></span>' +
      '<div class="chk-grid">' + READINESS.map(function (p) {
        return fCheck(p[1], "readiness." + p[0], tk.readiness[p[0]], {
          owner: HUMAN_READINESS.indexOf(p[0]) >= 0 ? "human" : null
        });
      }).join("") + "</div></div>" +

      '<div><span class="modal-section-label">审查关卡 Gates ' + tallyRequired(tk) +
      '<span class="sect-hint">按风险与分轨定 · 点 ⓘ 看这关查什么</span></span>' +
      '<div class="chk-grid">' + GATES.map(function (p) {
        var req = requiredGates(tk);
        var isReq = req.indexOf(p[0]) >= 0;
        var checked = tk.gates[p[0]];
        // 不适用的关卡要说明白，否则「未勾的灰方框」看起来像待办
        var note = isReq ? "" : (checked ? " · 非必需" : " · 不适用");
        return fCheck(p[1], "gates." + p[0], checked, {
          owner: isReq ? gateOwner(tk, p[0]) : null,
          note: note,
          dim: !isReq && !checked,
          info: p[0]
        });
      }).join("") + "</div>" +
      (openGate ? gateInfoHtml(tk, openGate) : "") + "</div>" +

      '<div><span class="modal-section-label">关联文档</span><div class="fld-grid">' +
      LINKS.map(function (p) { return fInput(p[1], "links." + p[0], tk.links[p[0]]); }).join("") +
      "</div></div>" +

      '<details class="sect"><summary>相关文件与证据</summary>' +
      fArea("相关文件 refs（一行一个路径）", "refs", (tk.refs || []).join("\n"), "lines", "src/foo.ts") +
      fArea("验证命令（一行一条）", "evidence.commands", (tk.evidence.commands || []).join("\n"), "lines", "npm test") +
      fArea("验证发现（一行一条）", "evidence.findings", (tk.evidence.findings || []).join("\n"), "lines", "12 passed") +
      fArea("残留风险", "evidence.residual", tk.evidence.residual, "text", "还没覆盖到的部分…") +
      "</details>" +

      '<div><span class="modal-section-label">留言</span>' + commentsHtml +
      '<div class="kind-pick">' +
        '<button type="button" data-kind="note" class="is-picked">留言</button>' +
        '<button type="button" data-kind="decision">决策</button>' +
        '<button type="button" data-kind="question">提问</button>' +
        (supersedingId ? '<span class="superseding">取代 ' + escapeHtml(supersedingId.slice(-4)) + ' <button type="button" id="cancel-supersede">×</button></span>' : "") +
      "</div>" +
      '<div class="comment-form"><textarea id="new-comment" placeholder="「决策」会被注入 agent 的下一轮 context；「留言」只是记录…"></textarea>' +
      '<button type="button" id="add-comment">送出</button></div></div>' +
      "</div>" +
      '<div class="modal-footer"><button type="button" class="danger-btn" id="delete-card">删除卡片</button><span></span></div>';

    var overlay = document.getElementById("modal-overlay");
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add("is-open"); });
  }

  function closeModal() {
    var overlay = document.getElementById("modal-overlay");
    overlay.classList.remove("is-open");
    setTimeout(function () { overlay.hidden = true; openId = null; openGate = null; }, 150);
  }

  function showToast(msg, isError) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("is-error", !!isError);
    el.classList.add("is-shown");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("is-shown"); }, 2600);
  }

  /* ── drag and drop ── */
  var dragId = null;

  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll(".ticket-card:not(.is-dragging)"));
    var closest = { offset: -Infinity, element: null };
    els.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }

  function commitDrop() {
    var changed = [];
    document.querySelectorAll(".lane").forEach(function (lane) {
      var stageId = lane.dataset.stage;
      var ids = Array.prototype.map.call(lane.querySelectorAll(".ticket-card"), function (el) { return el.dataset.id; });
      ids.forEach(function (id, i) {
        var tk = getTicket(id);
        if (!tk) return;
        var newOrder = i + 1;
        if (tk.stage !== stageId || tk.order !== newOrder) {
          tk.stage = stageId;
          tk.order = newOrder;
          changed.push(tk);
        }
      });
    });
    if (changed.length) {
      saveBulk(changed).then(function (resp) {
        // 必须用服务端返回的版本更新本地 rev，否则下一次拖拽会带着旧 rev 撞 409
        (resp.cards || []).forEach(function (saved) {
          var tk = getTicket(saved.id);
          if (tk) Object.keys(saved).forEach(function (k) { tk[k] = saved[k]; });
        });
      }).catch(function (err) {
        if (err && err.status === 409) return;   // onConflict 已经重载过了
        loadAll().then(renderAll);
      });
    }
  }

  /* ── events ── */
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".ticket-card");
    if (!card) return;
    dragId = card.dataset.id;
    setTimeout(function () { card.classList.add("is-dragging"); }, 0);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest(".ticket-card");
    if (card) card.classList.remove("is-dragging");
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { l.classList.remove("is-drag-over"); });
  });

  document.addEventListener("dragover", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane || !dragId) return;
    e.preventDefault();
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { if (l !== lane) l.classList.remove("is-drag-over"); });
    lane.classList.add("is-drag-over");
    var laneBody = lane.querySelector(".lane-body");
    var dragging = laneBody.querySelector(".is-dragging") || document.querySelector('.ticket-card[data-id="' + dragId + '"]');
    if (!dragging) return;
    var afterEl = getDragAfterElement(laneBody, e.clientY);
    var addBtn = laneBody.querySelector(".lane-add-btn");
    if (afterEl == null) laneBody.insertBefore(dragging, addBtn);
    else laneBody.insertBefore(dragging, afterEl);
  });

  document.addEventListener("drop", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove("is-drag-over");
    dragId = null;
    commitDrop();
  });

  document.addEventListener("click", function (e) {
    if (e.target.closest(".ticket-card")) { openModal(e.target.closest(".ticket-card").dataset.id); return; }

    var taskRow = e.target.closest(".task-row[data-open]");
    if (taskRow) { openModal(taskRow.dataset.open); return; }

    var viewTab = e.target.closest(".view-tabs button");
    if (viewTab) { switchView(viewTab.dataset.view); return; }

    var addBtn = e.target.closest("[data-add-to]");
    if (addBtn) {
      var stageId = addBtn.dataset.addTo;
      var form = document.createElement("div");
      form.className = "lane-add-form";
      form.innerHTML = '<input type="text" placeholder="卡片标题…" autofocus><div class="row">' +
        '<button type="button" class="save">新增</button><button type="button" class="cancel">取消</button></div>';
      addBtn.replaceWith(form);
      var input = form.querySelector("input");
      input.focus();
      function submit() {
        var title = input.value.trim();
        if (!title) return;
        createCard({ title: title, stage: stageId }).then(function (card) {
          TICKETS.push(card);
          renderAll();
        });
      }
      form.querySelector(".save").addEventListener("click", submit);
      form.querySelector(".cancel").addEventListener("click", renderAll);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); if (e.key === "Escape") renderAll(); });
      return;
    }

    if (e.target === document.getElementById("modal-overlay")) { closeModal(); return; }
    if (e.target.id === "modal-close-btn") { closeModal(); return; }

    var gi = e.target.closest("[data-gate-info]");
    if (gi && openId) {
      openGate = openGate === gi.dataset.gateInfo ? null : gi.dataset.gateInfo;
      reopenModal(openId);
      return;
    }

    var kindBtn = e.target.closest(".kind-pick button[data-kind]");
    if (kindBtn) {
      kindBtn.parentNode.querySelectorAll("button[data-kind]").forEach(function (b) {
        b.classList.toggle("is-picked", b === kindBtn);
      });
      return;
    }

    var supBtn = e.target.closest("[data-supersede]");
    if (supBtn && openId) {
      supersedingId = supBtn.dataset.supersede;
      reopenModal(openId);
      var ta = document.getElementById("new-comment");
      if (ta) ta.focus();
      showToast("写一条新决策来取代它；旧的会变成「已取代」，不再进入 agent 的 context");
      return;
    }
    if (e.target.id === "cancel-supersede" && openId) {
      supersedingId = null;
      reopenModal(openId);
      return;
    }

    if (e.target.id === "add-comment" && openId) {
      var textarea = document.getElementById("new-comment");
      var text = textarea.value.trim();
      if (!text) return;
      var kindEl = document.querySelector(".kind-pick .is-picked");
      var kind = kindEl ? kindEl.dataset.kind : "note";
      var cardId = openId;
      var sup = supersedingId ? [supersedingId] : [];
      if (sup.length) kind = "decision";   // 取代只对决策有意义
      addComment(cardId, kind, text, sup).then(function () {
        supersedingId = null;
        // 服务端只回一条留言；整卡（含新 rev）要重新拉，否则本地 rev 会过期
        return loadAll().then(function () { renderAll(); if (openId === cardId) reopenModal(cardId); });
      }).catch(function () {});
      return;
    }

    if (e.target.id === "delete-card" && openId) {
      if (!window.confirm("确定要删除 " + openId + " 吗？此操作无法撤销。")) return;
      var idToDelete = openId;
      deleteCard(idToDelete).then(function () {
        TICKETS = TICKETS.filter(function (x) { return x.id !== idToDelete; });
        closeModal();
        renderAll();
      });
      return;
    }
  });

  /* ── 统一的字段保存 ──
     上游是给每个字段各写一个 if 分支，所以只撑得住 title 和 content 两个。
     这里改成 data-field（值的路径）+ data-kind（怎么解析）驱动，加字段不用改
     这段逻辑。change 管 checkbox/select（立刻生效），blur 管文本框（避免每敲
     一个字就写一次盘）。两者都跑过去也无妨——值没变就直接返回。 */
  function parseFieldValue(el) {
    var kind = el.dataset.kind;
    if (kind === "bool") return el.checked;
    if (kind === "lines" || kind === "csv") {
      return el.value.split(kind === "lines" ? "\n" : /[,，、\s]+/)
        .map(function (s) { return s.trim(); }).filter(Boolean);
    }
    return el.value;
  }

  /** 重开 modal 但保住滚动位置和折叠区展开状态，否则改一个勾就跳回顶部。
   *  滚动的是 .modal-overlay（它才有 overflow-y: auto），不是 .modal-body。 */
  function reopenModal(id) {
    var overlay = document.getElementById("modal-overlay");
    var scroll = overlay ? overlay.scrollTop : 0;
    var det = document.querySelector("#modal details.sect");
    var wasOpen = !!(det && det.open);
    openModal(id);
    var nd = document.querySelector("#modal details.sect");
    if (nd) nd.open = wasOpen;
    if (overlay) overlay.scrollTop = scroll;
  }

  function applyField(el) {
    if (!openId || !el.dataset || !el.dataset.field) return;
    var tk = getTicket(openId);
    if (!tk) return;
    var path = el.dataset.field;
    var next = parseFieldValue(el);

    if (el.dataset.kind === "text-required") {
      next = String(next).trim();
      if (!next) { el.value = getPath(tk, path); showToast("标题不能为空", true); return; }
    } else if (el.dataset.kind === "text" && path !== "content" && path !== "evidence.residual") {
      next = String(next).trim();
    }
    if (JSON.stringify(getPath(tk, path)) === JSON.stringify(next)) return;

    var before = JSON.parse(JSON.stringify(tk));   // 服务端拒绝时回滚，避免界面和磁盘不一致
    setPath(tk, path, next);
    // 换车道时把 order 排到目标车道末尾，别和既有卡撞号
    if (path === "stage") {
      tk.order = ticketsByStage(next).reduce(function (m, c) {
        return c.id === tk.id ? m : Math.max(m, c.order);
      }, 0) + 1;
    }

    saveOne(tk).then(function (saved) {
      Object.keys(saved).forEach(function (k) { tk[k] = saved[k]; });
      renderAll();
      if (openId === tk.id) reopenModal(tk.id);
    }).catch(function (err) {
      if (err && err.status === 409) return;   // onConflict 已经重载过了
      Object.keys(tk).forEach(function (k) { delete tk[k]; });
      Object.keys(before).forEach(function (k) { tk[k] = before[k]; });
      renderAll();
      if (openId === tk.id) reopenModal(tk.id);
    });
  }

  document.addEventListener("change", function (e) { applyField(e.target); });
  document.addEventListener("blur", function (e) {
    if (e.target.type === "checkbox") return;   // checkbox 交给 change
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") applyField(e.target);
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("modal-overlay").hidden) closeModal();
  });

  loadAll().then(renderAll).catch(function (err) { showToast("读取失败：" + err.message, true); });
})();
</script>
</body>
</html>
